  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(56px, 10vh, 96px);
    padding: 48px 24px;
    background: var(--papel);
    color: var(--marinho);
    font-family: "Jost", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Logomarca ----------
     Proporções do manual (C = corpo de MOREIRA • OLIVEIRA):
     selo 0,85C · monograma 65% do selo · respiro 0,35C · tracking 0,08em
     ADVOCACIA Jost 400 a 0,5C, tracking +500 · distância 0,4C */
  .logo {
    --C: clamp(28px, 6.2vw, 76px);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    font-weight: inherit;
  }

  .logo__linha {
    display: flex;
    align-items: center;
    gap: calc(var(--C) * 0.35);
    font-family: "Bodoni Moda", "Didot", "Bodoni 72", serif;
    font-optical-sizing: none;
    font-variation-settings: "opsz" 8; /* mesmo padrão do logo de /links: filetes mais grossos */
    font-weight: 500;
    font-size: var(--C);
    line-height: 1;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  /* compensa o tracking da última letra para manter a simetria em torno do selo */
  .logo__palavra:last-child { margin-right: -0.08em; }

  .selo {
    flex: none;
    position: relative;
    width: calc(var(--C) * 0.85);
    height: calc(var(--C) * 0.85);
    border-radius: 50%;
    background: var(--marinho);
    transform: translateY(-0.04em);
  }
  .selo::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    height: 65%;
    aspect-ratio: 377 / 493;
    background: var(--papel);
    -webkit-mask: var(--mono) center / contain no-repeat;
            mask: var(--mono) center / contain no-repeat;
  }

  .logo__advocacia {
    margin-top: calc(var(--C) * 0.4);
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 400;
    font-size: calc(var(--C) * 0.5);
    line-height: 1;
    letter-spacing: 0.5em;
    margin-right: -0.5em; /* mantém o eixo centralizado no selo */
    color: var(--paranoa);
  }

  /* Versão vertical para telas estreitas: monograma acima, separador vira ponto */
  .logo__mono { display: none; }

  @media (max-width: 560px) {
    .logo { --C: clamp(22px, 7.4vw, 34px); }
    .logo__mono {
      display: block;
      height: calc(var(--C) * 3.4);
      aspect-ratio: 377 / 493;
      margin-bottom: calc(var(--C) * 0.9);
      background: var(--marinho);
      -webkit-mask: var(--mono) center / contain no-repeat;
              mask: var(--mono) center / contain no-repeat;
    }
    .logo__linha { gap: calc(var(--C) * 0.4); }
    .selo {
      width: calc(var(--C) * 0.16);
      height: calc(var(--C) * 0.16);
      transform: none;
    }
    .selo::after { display: none; }
  }

  /* ---------- Botão ---------- */
  .contato {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 18px 34px;
    border: 1px solid var(--marinho);
    background: var(--marinho);
    color: var(--papel);
    text-decoration: none;
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    transition: background-color .25s ease, border-color .25s ease;
  }
  .contato:hover { background: var(--paranoa); border-color: var(--paranoa); }
  .contato:focus-visible { outline: 2px solid var(--paranoa); outline-offset: 4px; }
  .contato svg { width: 18px; height: 18px; flex: none; fill: currentColor; }

  @media (prefers-reduced-motion: reduce) {
    .contato { transition: none; }
  }
</style>
